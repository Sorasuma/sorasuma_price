<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORASUMA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars"></div>

<div class="wrapper">
  <div class="card">
      <img src="avatar.png" class="avatar" alt="SORASUMA">

      <h1>SORASUMA</h1>

      <div class="status">Коммиссии открыты</div>
      <div class="divider">✮ ⋆ ˚｡𖦹 ⋆｡°✩</div>

      <div class="buttons">
          <a href="price.html" class="btn">Прайс-лист</a>
          <a href="rules.html" class="btn">Правила</a>
      </div>

      <div class="socials">
          <a href="https://linktr.ee/Sorasuma" class="social-btn" target="_blank">
              <img src="linktree.png" alt="Linktree">
          </a>

          <a href="https://vk.com/sorasuma" class="social-btn" target="_blank">
              <img src="vk.png" alt="VK">
          </a>
      </div>
  </div>

  <div class="footer-update">Последнее обновление 10.06.26</div>
</div>

<script>
const container = document.getElementById('stars');
for(let i=0;i<180;i++){
  const star=document.createElement('span');
  star.className='star';
  star.textContent='✦';
  star.style.left=Math.random()*100+'vw';
  star.style.top=Math.random()*100+'vh';
  star.style.fontSize=(4+Math.random()*10)+'px';
  star.style.animationDelay=(Math.random()*8)+'s';
  star.style.animationDuration=(4+Math.random()*6)+'s';
  container.appendChild(star);
}
</script>

</body>
</html>
