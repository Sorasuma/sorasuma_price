<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SORASUMA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars"></div>

<div class="card">
    <img src="avatar.png" class="avatar" alt="SORASUMA">

    <h1>SORASUMA</h1>

    <div class="status">Коммиссии открыты</div>
    <div class="divider">✮ ⋆ ˚｡𖦹 ⋆｡°✩</div>

    <div class="buttons">
        <a href="price.html" class="btn">Прайс-лист</a>
        <a href="rules.html" class="btn">Правила</a>
    </div>

    <div class="socials">
        <a href="https://linktr.ee/Sorasuma" target="_blank" class="social-btn">
            <img src="linktree.png" alt="Linktree">
        </a>

        <a href="https://vk.com/sorasuma" target="_blank" class="social-btn">
            <img src="vk.png" alt="VK">
        </a>
    </div>
</div>

<div class="footer-update">Последнее обновление 10.06.26</div>

<script>
const stars=document.getElementById('stars');
const chars=['.','✦','݁˖','⋆','˚࿔'];
for(let i=0;i<120;i++){
 const s=document.createElement('span');
 s.className='star';
 s.innerText=chars[Math.floor(Math.random()*chars.length)];
 s.style.left=Math.random()*100+'vw';
 s.style.top=Math.random()*100+'vh';
 s.style.animationDelay=(Math.random()*6)+'s';
 s.style.fontSize=(10+Math.random()*18)+'px';
 stars.appendChild(s);
}
</script>

</body>
</html>
