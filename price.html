<!DOCTYPE html><html lang='ru'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Прайс-лист</title><link rel='stylesheet' href='style.css'></head><body><div class='stars'></div><div class='page'><h1>Прайс-лист</h1><div class='panel'><h2>Скетчи</h2><p>✧︎500 - портрет<br>✧︎700 - половина тела<br>✧︎1000 - полный рост</p><div class='gallery'><a href='sketch/1.png'><img src='sketch/1.png'></a><a href='sketch/2.png'><img src='sketch/2.png'></a><a href='sketch/3.png'><img src='sketch/3.png'></a><a href='sketch/4.png'><img src='sketch/4.png'></a><a href='sketch/5.png'><img src='sketch/5.png'></a><a href='sketch/6.png'><img src='sketch/6.png'></a><a href='sketch/7.png'><img src='sketch/7.png'></a><a href='sketch/8.png'><img src='sketch/8.png'></a><a href='sketch/9.png'><img src='sketch/9.png'></a><a href='sketch/10.png'><img src='sketch/10.png'></a></div></div><a href='index.html' class='btn'>Назад</a></div><div class='lightbox' id='lightbox'><span class='lightbox-close'>&times;</span><img id='lightbox-img'></div><script>const l=document.getElementById('lightbox'),i=document.getElementById('lightbox-img');document.querySelectorAll('.gallery a').forEach(a=>a.onclick=e=>{e.preventDefault();i.src=a.href;l.classList.add('active')});l.onclick=e=>{if(e.target===l||e.target.classList.contains('lightbox-close'))l.classList.remove('active')};</script></body></html>
